# anoncat's DNS: Proton's resolver, reached through the tunnel. Installed at
# /etc/anoncat/resolv.conf and mounted over /etc/resolv.conf for the service
# only, so federation lookups never go to the home router or the ISP.
nameserver 10.2.0.1
# Backup for when Proton's resolver stops answering but the tunnel is up.
# Quad9 keeps no logs; the service can only use lo and wg0, so this goes
# through the tunnel too and Quad9 sees Proton's address, not ours.
nameserver 9.9.9.9
options edns0
