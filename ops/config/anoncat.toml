# anoncat's configuration. Lives inside the vault at
# /Drives/server/data/anoncat.toml (the installer puts it there and fills in
# the registration token). Everything not set here keeps the default from
# tuwunel-example.toml.

[global]
server_name = "anoncat.gleeze.com"
database_path = "/Drives/server/data/db"

# The public port is the systemd socket (anoncat.socket, 8448 bound to wg0,
# fed by the forwarded port). This listener is for this machine: local tools,
# `anoncat --health-check`, and this machine's own Matrix apps, which
# anoncat-netd sends here (on the tunnel address, 10.2.0.2) because the tunnel
# doesn't carry their connections to the public address back. Nothing outside
# reaches it: Proton forwards only the one port, and the firewall admits only
# 8448 on wg0.
address = ["127.0.0.1", "10.2.0.2"]
port = 8449

# Admin panel, loopback only: http://127.0.0.1:8450/_anoncat/panel/
admin_panel_address = "127.0.0.1:8450"

# Venice AI key for the panel's AI moderation (Settings page). Kept in the
# vault; the AI stays off until the file exists and it's switched on.
ai_key_file = "/Drives/server/data/secrets/venice"

# Online database backups (RocksDB backup engine), inside the vault; unchanged
# files are shared between backups. The daily anoncat-backup timer asks for
# one with SIGUSR2; the panel's Backups page shows them. See ops/backup/README.md.
database_backup_path = "/Drives/server/data/backups"
database_backups_to_keep = 7
admin_signal_execute = ["server backup-database"]

# No proxy in front, so the client address is the connection's own; headers
# can't fake it. Only used by in-memory rate limits.
ip_source = "connect_info"

log = "warn"

# --- registration --------------------------------------------------------------
# Accounts need a token: this one (from the installer) or invite tokens made in
# the panel. The first account registered becomes the server admin.
allow_registration = true
registration_token = "@REGISTRATION_TOKEN@"

# --- privacy -------------------------------------------------------------------
# Signing keys come from each server itself. Only when a server can't answer
# (old rooms are full of servers that shut down) is xmr.se asked for its
# old key, so joining those rooms works. xmr.se then sees which dead server's
# key was wanted, nothing about users; matrix.org is never asked.
trusted_servers = ["xmr.se"]
query_trusted_key_servers_first = false
query_trusted_key_servers_first_on_join = false

# Presence broadcasts when people are online; off, in and out.
allow_local_presence = false
allow_incoming_presence = false
allow_outgoing_presence = false

# Profiles only for signed-in users.
require_auth_for_profile_requests = true

# --- speed: the RAM-first profile (bench "ramfull") -----------------------------
db_cache_capacity_mb = 16384.0
cache_capacity_modifier = 8.0
rocksdb_max_write_buffer_number = 6
rocksdb_cache_compactions = true

# --- cleanup ---------------------------------------------------------------------
cleanup_remote_media_max_age = "30d"
cleanup_disk_percent = 90
cleanup_min_free_ram = "1 GiB"

[global.tls]
certs = "/Drives/server/data/tls/certificates/anoncat.gleeze.com.crt"
key = "/Drives/server/data/tls/certificates/anoncat.gleeze.com.key"
