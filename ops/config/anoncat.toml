# anoncat's configuration. Lives inside the vault at
# /Drives/server/data/anoncat.toml (the installer puts it there and fills in
# the registration token). Everything not set here keeps the default from
# tuwunel-example.toml.

[global]
server_name = "anoncat.gleeze.com"
database_path = "/Drives/server/data/db"

# The public port is the systemd socket (anoncat.socket, 8448 bound to wg0,
# fed by the forwarded port). This listener is for this machine: local tools,
# `anoncat --health-check`, and this machine's own Matrix apps, which
# anoncat-netd sends here (on the tunnel address, 10.2.0.2) because the tunnel
# doesn't carry their connections to the public address back. Nothing outside
# reaches it: Proton forwards only the one port, and the firewall admits only
# 8448 on wg0.
address = ["127.0.0.1", "10.2.0.2"]
port = 8449

# Admin panel, loopback only: http://127.0.0.1:8450/_anoncat/panel/
admin_panel_address = "127.0.0.1:8450"

# The AI service's key for the panel's AI moderation (Settings page). Kept in the
# vault; the AI stays off until the file exists and it's switched on.
ai_key_file = "/Drives/server/data/secrets/venice"

# Video previews: one still frame per video, taken by ffmpeg at lowest
# priority, one at a time (media_video_thumbnail_concurrency), so videos show
# a picture in clients and in the panel instead of a grey box.
media_video_thumbnail_command = ["nice", "-n", "19", "ffmpeg", "-nostdin", "-loglevel", "error", "-threads", "1", "-protocol_whitelist", "file", "-format_whitelist", "mov,mp4,m4a,3gp,3g2,mj2,matroska,webm,ogg,avi,mpegts,flv", "-i", "{input}", "-vf", "thumbnail=30", "-frames:v", "1", "-f", "image2pipe", "-c:v", "mjpeg", "pipe:1"]

# Online database backups (RocksDB backup engine), inside the vault; unchanged
# files are shared between backups. The daily anoncat-backup timer asks for
# one with SIGUSR2; the panel's Backups page shows them. See ops/backup/README.md.
database_backup_path = "/Drives/server/data/backups"
database_backups_to_keep = 2
admin_signal_execute = ["server backup-database"]

# No proxy in front, so the client address is the connection's own; headers
# can't fake it. Only used by in-memory rate limits.
ip_source = "connect_info"

log = "warn"

# Biggest request body, for anything but an upload. Bodies are held in
# memory and read before the request's sign-in is checked, so this stays small:
# with 1 GiB here, anyone could send a few huge requests to /login and run the
# server out of memory.
max_request_size = "24 MiB"

# Biggest single upload. Only an upload with a valid access token, checked
# before the file is read, may be this big. Uploads are held in memory while
# they arrive.
max_upload_size = "1 GiB"

# Longest a request may take, upload included (seconds). 30 minutes lets a
# 1 GiB upload finish on a slow phone connection through the VPN.
client_request_timeout = 1800

# --- registration --------------------------------------------------------------
# Apps signing up need a token: this one (from the installer) or invite tokens
# made in the panel. The first account registered in an app with this token
# becomes the server admin (never one made on the web sign-up page).
allow_registration = true
registration_token = "@REGISTRATION_TOKEN@"

# Or anyone can sign up at https://anoncat.gleeze.com/register (the front page
# sends it on to this server's /register): a picture captcha drawn here, no
# token, at most web_signups_per_hour accounts an hour. Matrix apps signing up
# directly still need the token, so bots can't go around the captcha. Signed-in
# people manage their account at /login.
web_signup = true
web_signups_per_hour = 10

# --- privacy -------------------------------------------------------------------
# Signing keys come from each server itself. Only when a server can't answer
# (old rooms are full of servers that shut down) is xmr.se asked for its
# old key, so joining those rooms works. xmr.se then sees which dead server's
# key was wanted, nothing about users; matrix.org is never asked.
trusted_servers = ["xmr.se"]
query_trusted_key_servers_first = false
query_trusted_key_servers_first_on_join = false

# Presence broadcasts when people are online; off, in and out.
allow_local_presence = false
allow_incoming_presence = false
allow_outgoing_presence = false

# Deleted messages aren't kept (save_unredacted_events is off); if that is
# ever turned on, keep the originals a week at most.
redaction_retention_seconds = 604800

# Profiles only for signed-in users.
require_auth_for_profile_requests = true

# --- speed: the RAM-first profile (bench "ramfull") -----------------------------
db_cache_capacity_mb = 16384.0
cache_capacity_modifier = 8.0
rocksdb_max_write_buffer_number = 6
rocksdb_cache_compactions = true

# --- cleanup ---------------------------------------------------------------------
cleanup_remote_media_max_age = "30d"
# Messages go after 30 days; ones with a picture, video, audio or file after
# 90. Encrypted messages can't be told apart, so they go after 30.
cleanup_message_max_age = "30d"
cleanup_media_message_max_age = "90d"
# The files themselves go 90 days after upload too, as the rules page says;
# otherwise only the messages would go and anyone with the link could still
# fetch the file. Profile and room pictures are kept.
cleanup_local_media_max_age = "90d"
# Everyone's uploads together; the oldest go first past this.
cleanup_local_media_max_size = "100 GiB"
cleanup_disk_percent = 90
cleanup_min_free_ram = "1 GiB"

# The rules and privacy page (published by anoncat-netd to the front page).
# Sign-up asks people to accept it. Raise the version when it changes.
[global.registration_terms.rules]
version = "2"

[global.registration_terms.rules.translations.en]
name = "Rules and privacy"
url = "https://anoncat.gleeze.com/rules"

[global.tls]
certs = "/Drives/server/data/tls/certificates/anoncat.gleeze.com.crt"
key = "/Drives/server/data/tls/certificates/anoncat.gleeze.com.key"
