# The VPS's port 443, shared by anoncat.gleeze.com and anoncat.cc (ops/vps/
# vps-router). It reads only the name a connection asks for (TLS SNI) and
# passes the still-encrypted connection to that server; it never decrypts,
# and keeps no logs. Other Matrix servers reach anoncat.gleeze.com on 8448
# directly, and anoncat.cc through here.
global
	maxconn 20000
	# No logs: who connected when is nobody's business.
	log /dev/null local0 emerg
	user haproxy
	group haproxy
	chroot /var/lib/haproxy

defaults
	mode tcp
	timeout connect 5s
	# Long: open sync requests and big uploads.
	timeout client 1h
	timeout server 1h
	timeout client-fin 30s
	timeout tunnel 1h

frontend public
	bind :::443 v4v6
	tcp-request inspect-delay 5s
	tcp-request content accept if { req.ssl_hello_type 1 }
	use_backend cc if { req.ssl_sni -i anoncat.cc }
	use_backend cc if { req.ssl_sni -m end -i .anoncat.cc }
	default_backend gleeze

backend gleeze
	server anoncat 127.0.0.1:8443

backend cc
	server anoncat-cc 127.0.0.1:9443
